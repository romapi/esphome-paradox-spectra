# Minimal example — Paradox Spectra passive decoder on a plain ESP32.
# Replace zone numbers/names with your panel's (trip a zone and read the log, or watch
# the "Last Event" sensor, to learn each zone number + its label).

esphome:
  name: paradox

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://romapi/esphome-paradox-spectra@main
    components: [paradox_spectra]

# Passive tap: RX only. Panel serial TX -> ESP RX (via a 5V->3.3V level shifter).
uart:
  id: uart_paradox
  rx_pin: GPIO16
  baud_rate: 9600
  rx_buffer_size: 512

paradox_spectra:
  uart_id: uart_paradox
  debug_frames: true
  last_event:
    name: "Last Event"
  zones:
    - { zone: 1, name: "Living Room", device_class: motion }
    - { zone: 2, name: "Front Door",  device_class: door }
    - { zone: 7, type: fire, name: "Smoke Hall", device_class: smoke }
